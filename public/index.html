<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сечения</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23202d3a'/%3E%3Cpath d='M8 22 L8 10 L20 14 L20 26 Z' fill='none' stroke='%234cc9f0' stroke-width='2'/%3E%3Cpath d='M8 22 L20 14' stroke='%23f72585' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel left">
        <div class="group">
          <div class="group-title">Фигура</div>
          <div class="row solids" id="solids"></div>
        </div>

        <div class="group">
          <div class="group-title">Инструменты</div>
          <div class="tools" id="tools"></div>
        </div>

        <div class="group">
          <div class="group-title">Действия</div>
          <button id="delete-selected" class="action danger">Удалить выбранное</button>
          <button id="cancel" class="action">Сбросить ввод</button>
          <div class="row">
            <button id="undo" class="action" title="Отменить" aria-label="Отменить">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6 3.5 2.5 7 6 10.5" />
                <path d="M2.5 7h6.2a4 4 0 0 1 0 8H6" />
              </svg>
            </button>
            <button id="redo" class="action" title="Вернуть" aria-label="Вернуть">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M10 3.5 13.5 7 10 10.5" />
                <path d="M13.5 7H7.3a4 4 0 0 0 0 8H10" />
              </svg>
            </button>
            <button id="fit" class="action" title="Показать фигуру целиком">Вид</button>
          </div>
          <div class="row toggles">
            <button id="snap-toggle" class="action toggle active" aria-pressed="true">Притягивание</button>
            <button id="chain-toggle" class="action toggle active" aria-pressed="true">Цепочка сечения</button>
          </div>
          <div class="row">
            <button id="clear" class="action danger">Очистить</button>
          </div>
          <button id="demo" class="action">Загрузить демо-сечение</button>
        </div>
      </aside>

      <main class="stage">
        <canvas id="view"></canvas>
        <div id="cursor-info" class="cursor-info"></div>
        <div class="status">
          <div id="pending" class="pending"></div>
        </div>
        <div id="flash" class="flash" role="status" aria-live="polite"></div>
      </main>

      <aside class="panel right">
        <div class="group">
          <div class="group-title">Свойства</div>
          <div id="properties"></div>
        </div>
        <div class="group grow">
          <div class="group-title">Объекты</div>
          <div id="objects" class="objects"></div>
        </div>
        <button id="help-open" class="action">Управление</button>
      </aside>
    </div>

    <dialog id="help" class="help-dialog" aria-labelledby="help-title">
      <div class="help-head">
        <h2 id="help-title">Управление</h2>
        <button id="help-close" class="action">Закрыть</button>
      </div>
      <dl class="help" id="help-list"></dl>
    </dialog>
    <script type="module" src="dist/app.js"></script>
  </body>
</html>
